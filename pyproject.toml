[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-web"
version = "2.5.0"
description = "Autonomous Multi-Agent AI Workstation, Live Voice Orchestrator, and PowerToys FancyZones Desktop Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sahil Kumar Dhala", email = "sahil@maxmasai.com" }
]
keywords = [
    "agentic-ai",
    "multi-agent",
    "gemini",
    "deepseek",
    "claude",
    "playwright",
    "pyside6",
    "mcp",
    "fancyzones"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: User Interfaces"
]

dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "huggingface_hub>=0.25.0",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "playwright>=1.48.0",
    "protobuf>=4.25.0",
    "pypdf>=5.0.0",
    "pyside6>=6.7.0",
    "pyside6_addons>=6.7.0",
    "pyside6_essentials>=6.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "sounddevice>=0.5.0",
    "uvicorn>=0.30.0",
    "watchdog>=4.0.0",
    "websockets>=13.0",
    "youtube_transcript_api>=0.6.0"
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; sys_platform == 'win32'"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "PyInstaller>=6.10.0"
]

[project.scripts]
agentic = "system.cli_launcher:main"
agentic-web = "app:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
