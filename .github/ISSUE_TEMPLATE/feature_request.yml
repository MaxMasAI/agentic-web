name: ✨ Feature Request
description: Suggest an idea or architectural improvement for Agentic Web.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Agentic Web!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Architecture
      description: Describe the solution or new capability you would like to see implemented.
      placeholder: Add support for custom MCP tools that can...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Target Component
      options:
        - Multi-Agent Orchestrator / Command Hierarchy
        - Skills Vault & Personas
        - Infinite Canvas DAG IDE
        - Monaco VS Code Studio
        - Token Telemetry & Rate Limiting
        - Chrome DevTools Protocol (CDP) / Browser HUD
        - Gemini Live Voice Bridge
        - Desktop GUI (PySide6 / Themes)
        - Documentation / Web App
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or test this feature!
          required: false
